# Atlas Intelligence: docker compose up --build
# Startup order: db + redis (healthy) -> api (runs migrations, seeds demo data if DEMO_MODE) -> worker + web.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: atlas
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
    # no host port is published: only the api/worker containers can reach the database

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:${POSTGRES_PASSWORD:-atlas}@db:5432/atlas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8001:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ./apps/api
    command: celery -A app.workers.celery_app worker -l info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:${POSTGRES_PASSWORD:-atlas}@db:5432/atlas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: { condition: service_healthy }   # migrations have run
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args: { NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}" }
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login >/dev/null || exit 1"], interval: 15s, timeout: 5s, retries: 10, start_period: 30s }
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
